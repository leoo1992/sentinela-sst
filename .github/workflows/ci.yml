name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type checking
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Repository tests + coverage 80%
        run: node --test --experimental-test-coverage --test-coverage-lines=80 tests/repository-quality.test.mjs
      - name: Build
        run: npm run build
      - name: Docker build
        run: docker build -t sentinela-sst-ci .

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: pip install "fastapi>=0.141.1" "pydantic>=2.10.0" "pytest>=8.3.4" "httpx>=0.28.1" "mypy>=1.18,<2"
      - name: Python type checking
        continue-on-error: true
        run: PYTHONPATH=. mypy api --config-file mypy.ini
      - name: Backend tests
        run: PYTHONPATH=. pytest -q
