[project]
name = "sentinela-sst-api"
version = "1.0.0"
description = "Backend FastAPI do Sentinela SST."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "pydantic>=2.10.0",
  "numpy>=2.2,<3",
  "opencv-python-headless==4.13.0.92"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
